<section class="section section--surface" id="terminology">
  <div class="container container-narrow">
    <h2 class="section-title">{{ i18nCommon.jargonVerification.title }}</h2>
    <p class="muted" style="margin-bottom: 20px;">
      {{ i18nCommon.jargonVerification.leadBefore }}
      <a href="{{ '/docs/glossary.html' | locale_path: localePrefix }}">{{ i18nCommon.jargonVerification.glossaryLink }}</a>.
    </p>
    <dl class="jargon-list">
      {% for item in i18nCommon.jargonVerification.items %}
      <div class="jargon-item">
        <dt>{{ item.term }}</dt>
        <dd>{{ item.body }}</dd>
      </div>
      {% endfor %}
    </dl>
  </div>
</section>
