<div
  class="product-carousel product-visual__frame{% if frameClass %} product-visual__frame--{{ frameClass }}{% endif %}"
  data-carousel-id="{{ carouselId }}"
  data-carousel-interval="{{ carousel.intervalSeconds | default: 10 }}"
>
  <div
    class="product-carousel__viewport"
    tabindex="0"
    role="region"
    aria-label="{{ ariaLabel }}"
    aria-roledescription="carousel"
  >
    {% for slide in carousel.slides %}
    <div
      class="product-carousel__slide{% if forloop.first %} is-active{% endif %}"
      data-slide-label="{{ slide.label }}"
      data-slide-index="{{ forloop.index0 }}"
    >
      <img
        class="product-shot__img{% if forloop.first %} is-loaded{% endif %}"
        src="/assets/img/screenshots/{{ slide.file }}"
        alt="{{ slide.alt }}"
        width="1280"
        height="800"
        loading="{% if forloop.first %}eager{% else %}lazy{% endif %}"
      />
      <div class="product-shot__placeholder">
        <span class="product-shot__placeholder-title">{{ slide.label }}</span>
        <span class="product-shot__placeholder-hint">{{ placeholderHint }}</span>
      </div>
    </div>
    {% endfor %}
    <span class="product-carousel__zoom-hint" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M21 21l-4.35-4.35M11 8v6M8 11h6"></path>
      </svg>
      Enlarge
    </span>
    <div class="product-carousel__chrome" aria-hidden="true">
      <button
        type="button"
        class="product-carousel__btn product-carousel__btn--prev"
        aria-label="Previous slide"
        tabindex="-1"
      >
        <span aria-hidden="true">&#8249;</span>
      </button>
      <div class="product-carousel__dots" role="tablist" aria-label="Slides">
        {% for slide in carousel.slides %}
        <button
          type="button"
          class="product-carousel__dot{% if forloop.first %} is-active{% endif %}"
          role="tab"
          aria-label="{{ slide.label }}"
          aria-selected="{% if forloop.first %}true{% else %}false{% endif %}"
          data-slide-index="{{ forloop.index0 }}"
          tabindex="-1"
        ></button>
        {% endfor %}
      </div>
      <button
        type="button"
        class="product-carousel__btn product-carousel__btn--next"
        aria-label="Next slide"
        tabindex="-1"
      >
        <span aria-hidden="true">&#8250;</span>
      </button>
    </div>
  </div>
</div>
